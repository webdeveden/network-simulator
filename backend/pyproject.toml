[project]
name = "netsim-backend"
version = "0.1.0"
description = "NetSim API: accounts, saved networks, mission progress"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sqlmodel>=0.0.19",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
]

# Installed by `uv sync` (local, CI); skipped in the Docker image with --no-dev
[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

# An app, not a library: uv installs the dependencies but doesn't build/install this project
[tool.uv]
package = false
