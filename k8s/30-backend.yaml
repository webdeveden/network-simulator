# The API, running as 2 identical pods. Login counters and cached progress are in Redis, not in
# Python memory, which is what makes this safe: both pods see the same data.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: netsim
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # Built on this Mac and loaded with `kind load docker-image`: the published images are
          # amd64 only until CI's multi-arch build reaches main. Then use
          # ghcr.io/webdeveden/netsim-backend:sha-<commit> and remove imagePullPolicy.
          image: netsim-backend:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: netsim-config }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: netsim-secrets, key: DATABASE_URL }
            - name: NETSIM_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: netsim-secrets, key: NETSIM_SECRET_KEY }
          # Readiness: failing removes the pod from the Service, so it gets no traffic.
          readinessProbe:
            httpGet: { path: /api/health, port: 8000 }
            periodSeconds: 5
          # Liveness: failing restarts the container, for a process that is stuck.
          livenessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          # A pod being removed leaves the Service at the same moment it's told to stop, and the
          # nodes take a moment to notice. Waiting first means no request reaches it after it closes.
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
---
# ClusterIP (the default): reachable only inside the cluster. There is no way in from the Mac,
# so nothing can reach the backend without passing through nginx.
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: netsim
spec:
  selector:
    app: backend
  ports:
    - port: 8000
