# Postgres. A StatefulSet, not a Deployment: its pod keeps a fixed name (postgres-0) and its own
# disk, which comes back attached when the pod is replaced.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: netsim
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: netsim-secrets, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: netsim-secrets, key: POSTGRES_PASSWORD }
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: netsim-secrets, key: POSTGRES_DB }
            # A subfolder, because Postgres refuses a data directory that isn't empty
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          # Readiness: "send it traffic yet?" Same check as compose's healthcheck.
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\""]
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
  # Asks for a 1Gi disk for each pod; this is what survives pod restarts.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: netsim
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
