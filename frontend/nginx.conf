server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # Overwrite, don't append: a client could send its own X-Forwarded-For to fake its IP
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Built files have content hashes in their names: cache them for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The page itself must always be fresh, or browsers keep loading an old build.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
