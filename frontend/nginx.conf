server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's built-in DNS server. With a plain `proxy_pass http://backend:8000` nginx looks the
    # name up once at startup and keeps that IP forever: recreate the backend container (new IP)
    # and every /api request fails with 502 until nginx restarts. A variable in proxy_pass makes
    # nginx resolve the name again, caching the answer for 10s.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    location /api/ {
        # No path after the host, so the original URI (/api/...) is passed on unchanged
        proxy_pass $backend;
        proxy_set_header Host $host;
        # Overwrite, don't append: a client could send its own X-Forwarded-For to fake its IP
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Built files have content hashes in their names: cache them for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The page itself must always be fresh, or browsers keep loading an old build.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
